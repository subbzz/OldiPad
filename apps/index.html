<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Launcher">
  <meta name="format-detection" content="telephone=no">
  <title>Old iPad</title>
  <link rel="apple-touch-icon" href="icons/launcher.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Old iPad</h1>
      <p>These are HTML5 web apps, not App Store apps. Open YouTube or WhatsApp, then Share &rarr; Add to Home Screen.</p>
    </header>

    <nav class="grid">
      <a class="tile" href="youtube.html">
        <img src="icons/youtube.png" width="180" height="180" alt="">
        <span>YouTube</span>
      </a>
      <a class="tile" href="whatsapp.html">
        <img src="icons/whatsapp.png" width="180" height="180" alt="">
        <span>WhatsApp</span>
      </a>
      <a class="tile" href="https://mail.google.com">
        <img src="icons/gmail.png" width="180" height="180" alt="">
        <span>Gmail</span>
      </a>
      <a class="tile" href="https://maps.google.com">
        <img src="icons/maps.png" width="180" height="180" alt="">
        <span>Maps</span>
      </a>
      <a class="tile" href="https://www.abc.net.au/news">
        <img src="icons/news.png" width="180" height="180" alt="">
        <span>ABC News</span>
      </a>
      <a class="tile" href="https://www.bom.gov.au">
        <img src="icons/weather.png" width="180" height="180" alt="">
        <span>BOM Weather</span>
      </a>
    </nav>

  </div>
</body>
</html>
